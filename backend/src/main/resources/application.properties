spring.application.name=madhouse_app

# Consumo de BD Local
#spring.datasource.url=jdbc:mysql://localhost:3306/madhouse
#spring.datasource.username=root
#spring.datasource.password=1022405079

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8081} // define el puerto del servidor, con un valor predeterminado de 8081 si no se proporciona a través de la variable de entorno PORT
# server.port=8081 local

server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local      -> usa variables locales
# Railway    -> inyecta variables automáticamente